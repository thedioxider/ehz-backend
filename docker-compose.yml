# ehz-backend — operator-facing compose file.
#
# Ships image-only. Contributors wanting to build from source use the
# docker-compose.dev.yml overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ehz
      POSTGRES_USER: ehz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehz}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehz -d ehz"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: diomentia/ehz-backend-app:${EHZ_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ehz
      SPRING_DATASOURCE_USERNAME: ehz
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ehz}
      EHZ_DATA_DIR: /data
      EHZ_LAN_INGEST_PORT: "8081"
      EHZ_PUBLIC_API_PORT: "19081"
      # Inside the container, the management (dashboard) listener has to bind
      # 0.0.0.0 so Docker can forward the published host port to it. The host
      # binding `127.0.0.1:19080` below is what actually keeps the dashboard
      # off the LAN — the container-internal listener is on the Docker bridge,
      # which isn't routed from outside.
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    volumes:
      - ./data:/data
    ports:
      # Dashboard — operator-only, bound to loopback on the host.
      - "127.0.0.1:19080:8080"
      # LAN ingest — reachable from the Android app on the local network.
      - "19081:8081"
      # Port 8082 (internal API) is DELIBERATELY NOT PUBLISHED. Frontend and
      # other sibling services reach it over the compose bridge network.

  discovery-sidecar:
    image: diomentia/ehz-backend-sidecar:${EHZ_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - app
    # Host networking is required: the UDP discovery protocol uses fixed
    # ports (5353/udp mDNS, 5370/udp broadcast responder) that the Android
    # client can't discover through Docker's NAT. The sidecar announces the
    # app's LAN ingest port (published by the `app` service above).
    network_mode: host
    environment:
      EHZ_ANNOUNCE_PORT: "19081"
      EHZ_ANNOUNCE_IP: ${EHZ_ANNOUNCE_IP:-auto}
      EHZ_CONTRACT_VERSION: "1"

  # ------------------------------------------------------------------
  # Placeholder: operator web frontend (not yet implemented).
  #
  # When added, it goes on the default compose bridge so it can reach the
  # app's internal API at http://app:8082/api/... without crossing any
  # published port. The frontend itself would publish a localhost-only
  # port for the operator (e.g. 127.0.0.1:19090:80), mirroring the
  # dashboard's "localhost is the trust boundary" posture.
  # ------------------------------------------------------------------
  # frontend:
  #   image: diomentia/ehz-backend-frontend:${EHZ_VERSION:-latest}
  #   restart: unless-stopped
  #   depends_on:
  #     - app
  #   environment:
  #     EHZ_INTERNAL_API_BASE: http://app:8082/api
  #   ports:
  #     - "127.0.0.1:19090:80"
