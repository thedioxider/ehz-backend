openapi: 3.1.0
info:
  title: ehz-backend API
  description: Wire contract for the ehz-backend service. Contract version 1 — bump
    on any backwards-incompatible change.
  version: "1"
servers:
- url: /
  description: ehz-backend
security:
- bearerAuth: []
paths:
  /api/reports/{id}:
    get:
      tags:
      - report-query-controller
      operationId: detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReportDetailDto"
  /api/reports:
    get:
      tags:
      - report-query-controller
      operationId: list
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: route
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: section
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: inspector
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelReportSummaryDto"
  /api/photos/{reportId}/{siteId}/{specId}.webp:
    get:
      tags:
      - photo-controller
      operationId: get
      parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: specId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
  /api/config/report-config:
    get:
      tags:
      - report-config-controller
      operationId: reportConfig
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema:
                type: string
                format: byte
  /api/config/areas:
    get:
      tags:
      - areas-controller
      operationId: areas
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema:
                type: string
components:
  schemas:
    CoordinatesDto:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
    FieldDto:
      type: object
      properties:
        spec_id:
          type: string
        name:
          type: string
        type:
          type: string
        value:
          type: string
        unit:
          type:
          - string
          - "null"
    ReportDto:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        inspector:
          type: string
        route:
          $ref: "#/components/schemas/RouteDto"
        section:
          $ref: "#/components/schemas/SectionDto"
        sites:
          type: array
          items:
            $ref: "#/components/schemas/SiteDto"
    RouteDto:
      type: object
      properties:
        length_km:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        name:
          type: string
    SectionDto:
      type: object
      properties:
        begin_km:
          type: integer
          format: int32
        end_km:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
    SiteDto:
      type: object
      properties:
        position_km:
          type: number
          format: double
        validation_id:
          type: string
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        name:
          type: string
        location:
          oneOf:
          - $ref: "#/components/schemas/CoordinatesDto"
          - type: "null"
        fields:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/FieldDto"
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelReportSummaryDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ReportSummaryDto"
        page:
          $ref: "#/components/schemas/PageMetadata"
    ReportSummaryDto:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        site_count:
          type: integer
          format: int64
        id:
          type: string
          format: uuid
        route:
          $ref: "#/components/schemas/RouteSummaryDto"
        section:
          $ref: "#/components/schemas/SectionSummaryDto"
        inspector:
          type: string
    RouteSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SectionSummaryDto:
      type: object
      properties:
        begin_km:
          type: integer
          format: int32
        end_km:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
    CoordinatesViewDto:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
    FieldViewDto:
      type: object
      properties:
        spec_id:
          type: string
        name:
          type: string
        type:
          type: string
        unit:
          type:
          - string
          - "null"
        value:
          type:
          - string
          - "null"
    ReportDetailDto:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        inspector:
          type: string
        route:
          $ref: "#/components/schemas/RouteSummaryDto"
        section:
          $ref: "#/components/schemas/SectionSummaryDto"
        sites:
          type: array
          items:
            $ref: "#/components/schemas/SiteViewDto"
    SiteViewDto:
      type: object
      properties:
        position_km:
          type: number
          format: double
        validation_id:
          type: string
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        name:
          type: string
        location:
          oneOf:
          - $ref: "#/components/schemas/CoordinatesViewDto"
          - type: "null"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldViewDto"
  securitySchemes:
    bearerAuth:
      type: http
      description: Static API key — obtain from the operator dashboard.
      scheme: bearer
