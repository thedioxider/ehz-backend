spring:
  application:
    name: ehz-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ehz}
    username: ${SPRING_DATASOURCE_USERNAME:ehz}
    password: ${SPRING_DATASOURCE_PASSWORD:ehz}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jackson:
    datatype:
      datetime:
        # Interpret numeric Instant values as epoch seconds (not nanos).
        # The app currently emits epoch-seconds integers; ISO-8601 strings also work.
        # Jackson 3 moved date/time-specific features out of DeserializationFeature
        # into DateTimeFeature, so this lives under spring.jackson.datatype.datetime.*
        # (Boot 4), not spring.jackson.deserialization.* (Boot 3).
        read-date-timestamps-as-nanoseconds: false
  servlet:
    multipart:
      max-request-size: 64MB
      max-file-size: 64MB

server:
  # Internal API — reachable only from the Docker bridge network (compose doesn't publish 8082).
  port: 8082
  address: 0.0.0.0
  tomcat:
    max-http-form-post-size: 64MB
    max-swallow-size: 64MB
  max-http-request-header-size: 16KB

management:
  server:
    # Dashboard + Actuator — host-mapped to 127.0.0.1 only, never LAN.
    port: 8080
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

ehz:
  data-dir: ${EHZ_DATA_DIR:./data}
  # Directory that holds operator-editable config overrides (e.g. report-config.yaml).
  # Falls back to `${ehz.data-dir}/config` when no env var is set — Spring resolves the
  # nested ${} placeholder natively.
  config-dir: ${EHZ_CONFIG_DIR:${ehz.data-dir}/config}
  # LAN ingest listener (app-facing). Added programmatically via WebServerFactoryCustomizer.
  lan-ingest-port: ${EHZ_LAN_INGEST_PORT:8081}
